<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#07070a">
<title>PerezAI · Red</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;background:#07070a radial-gradient(ellipse at 50% 20%,rgba(252,175,23,.18),transparent 60%);color:#f4f1ea;font-family:"Segoe UI",system-ui,Arial,sans-serif;text-align:center}
.c{max-width:420px;width:100%}
h1{font:900 44px/1 Impact,"Arial Narrow Bold",sans-serif;letter-spacing:2px;margin:0;background:linear-gradient(180deg,#fff,#fcaf17);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#b9b3a6;font-size:16px;line-height:1.5;margin:14px 0 0}
.r{width:46px;height:46px;margin:26px auto 0;border:4px solid rgba(252,175,23,.25);border-top-color:#fcaf17;border-radius:50%;animation:g .8s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
a{color:#fcaf17}
</style></head>
<body><div class="c"><h1>PEREZAI</h1><p id="t">Buscando el servidor que está encendido…</p><div class="r" id="r"></div></div>
<script>
// Dirección FIJA de la red. Si el servidor de Perez está encendido, va a su /red; si está caído, al de reserva (Cristian).
(function(){
  var RUTA='/red'+location.search+location.hash,t=document.getElementById('t');
  function leerGh(arch){return fetch('https://api.github.com/repos/pruebamk14-dotcom/perezai-radio/contents/'+arch+'?t='+Date.now(),{headers:{Accept:'application/vnd.github+json'}}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){return atob((j.content||'').replace(/\n/g,''))})
   .catch(function(){return fetch('../'+arch+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).catch(function(){return ''})})}
  function vivo(u){u=(u||'').trim().replace(/\/+$/,'');if(!/^https:\/\/[a-z0-9.-]+$/i.test(u))return Promise.resolve(null);var ctl=new AbortController();var k=setTimeout(function(){ctl.abort()},8000);
   return fetch(u+'/api/planes?t='+Date.now(),{cache:'no-store',signal:ctl.signal}).then(function(r){return r.json()}).then(function(d){clearTimeout(k);return d&&d.ok?u:null}).catch(function(){clearTimeout(k);return null})}
  leerGh('servidor.txt').then(vivo).then(function(u){if(u)return u;t.textContent='El servidor principal no contesta. Probando el de reserva…';return leerGh('servidor_respaldo.txt').then(vivo)})
   .then(function(u){if(u){location.replace(u+RUTA);return}document.getElementById('r').style.display='none';t.innerHTML='Los servidores están apagados ahora mismo.<br>Prueba otra vez en un rato. <a href="">Reintentar</a>'})
   .catch(function(){t.textContent='No pude conectar. Revisa tu internet y recarga la página.'});
})();
</script></body></html>
